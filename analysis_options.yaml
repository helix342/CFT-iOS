# Static analysis configuration for Wood CFT.
#
# This is a correctness-critical ledger / billing app: silent type coercions,
# implicit dynamics, and unchecked edge cases can corrupt money or stock.
# The config below layers strict analyzer modes and additional lint rules on
# top of `flutter_lints` to catch those classes of mistakes at analysis time.
#
# Run with: `flutter analyze`

include: package:flutter_lints/flutter.yaml

analyzer:
  # Treat the language's optional strictness checks as hard requirements.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote correctness-relevant lints to errors so CI (and `flutter analyze`)
    # fails instead of merely warning.
    always_declare_return_types: error
    avoid_dynamic_calls: error
    cast_nullable_to_non_nullable: error
    close_sinks: error
    missing_whitespace_between_adjacent_strings: ignore
    unawaited_futures: error
    unnecessary_null_checks: error
    # Generated code (e.g. drift builders added in later tasks) lives under
    # these paths; don't fail analysis on their output.
    todo: ignore
  exclude:
    - build/**
    - ios/**
    - windows/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - web/**
    - android/**

linter:
  rules:
    # Correctness / safety
    always_use_package_imports: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: true
    discarded_futures: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    no_duplicate_case_values: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true

    # Immutability / value-object friendliness (CFT, Money are immutable)
    avoid_equals_and_hash_code_on_mutable_classes: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true

    # Readability / consistency
    always_declare_return_types: true
    directives_ordering: true
    omit_local_variable_types: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_constructors_first: true
    unnecessary_lambdas: true
    use_super_parameters: true
